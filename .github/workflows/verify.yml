name: Verify preview channel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify channel
        shell: bash
        run: |
          if [[ -f channel.json ]]; then
            python tools/verify_channel.py channel.json
          else
            echo "Initial repository has no published channel yet."
